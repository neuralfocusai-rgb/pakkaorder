<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PakkaOrder — Confirm</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--v:#7c3aed;--c:#22d3ee;--m:#f0abfc;--g:#34d399;--r:#fb7185;--bg:#05060f;--txt:#eef2ff;--mut:#8b93b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.32;animation:fl 16s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--v);top:-20vmax;left:-15vmax}
.aurora i:nth-child(2){background:var(--c);bottom:-25vmax;right:-15vmax;animation-delay:-6s}
.aurora i:nth-child(3){background:var(--m);top:30%;left:35%;width:40vmax;height:40vmax;opacity:.16;animation-delay:-11s}
@keyframes fl{to{transform:translate(9%,7%) scale(1.18)}}
.wrap{max-width:430px;width:100%}
.logo{text-align:center;font-size:26px;font-weight:700;letter-spacing:.5px}
.logo b{background:linear-gradient(90deg,var(--c),var(--v),var(--m));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px auto 14px;width:fit-content;padding:7px 16px;border-radius:99px;background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.4);font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);animation:pu 1.2s infinite}
@keyframes pu{50%{opacity:.25}}
.langs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.langs button{padding:7px 14px;border-radius:99px;border:1px solid rgba(139,147,184,.25);background:rgba(20,24,45,.5);backdrop-filter:blur(10px);color:var(--mut);font-size:12px;cursor:pointer;transition:.2s}
.langs button.on{border-color:var(--c);color:var(--txt);box-shadow:0 0 18px rgba(34,211,238,.35)}
.glass{background:rgba(16,20,40,.6);backdrop-filter:blur(20px);border:1px solid rgba(124,58,237,.35);border-radius:26px;padding:22px;margin-bottom:16px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.row{font-size:14px;line-height:1.65;color:var(--mut)}
.row b{color:var(--txt);font-weight:600}
.cod{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:12px;background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(124,58,237,.15));border:1px solid rgba(34,211,238,.4);font-weight:700;color:var(--c);font-size:15px}
.q{font-size:15px;font-weight:600;margin:16px 0 10px}
.addr{display:flex;gap:9px}
.addr button{flex:1;padding:12px;border-radius:14px;border:1px solid rgba(139,147,184,.25);background:rgba(10,13,28,.6);color:var(--mut);font-size:13px;cursor:pointer;transition:.2s}
.addr button.on{border-color:var(--g);color:var(--g);box-shadow:0 0 16px rgba(52,211,153,.3)}
.big{width:100%;padding:18px;border:0;border-radius:18px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:11px;transition:transform .12s;letter-spacing:.3px}
.big:active{transform:scale(.97)}
.yes{background:linear-gradient(135deg,var(--c),var(--v));color:#fff;box-shadow:0 12px 44px rgba(124,58,237,.5)}
.no{background:transparent;border:1.5px solid rgba(251,113,133,.55);color:var(--r)}
.done{text-align:center;padding:26px 8px}
.check{width:88px;height:88px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--c));display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 60px rgba(52,211,153,.5)}
.check:after{content:'';width:26px;height:46px;border:solid #052e22;border-width:0 5px 5px 0;transform:rotate(45deg) translate(-2px,-4px)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.dt{font-size:17px;font-weight:600;line-height:1.5}
.err{text-align:center;color:var(--r);padding:26px;font-weight:600}
.foot{text-align:center;color:rgba(139,147,184,.5);font-size:11px;margin-top:14px;letter-spacing:1px}
</style></head><body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="wrap">
<div class="logo">Pakka<b>Order</b></div>
<div class="pill"><span class="dot"></span><span id="st"></span></div>
<div class="langs" id="langs"></div>
<div id="main">
<div class="err" id="err" style="display:none"></div>
<div id="body" style="display:none">
<div class="glass">
  <div class="row"><b id="o_ref"></b></div>
  <div class="row" id="o_name"></div>
  <div class="row" id="o_addr"></div>
  <span class="cod" id="o_cod"></span>
  <div class="q" id="q_addr"></div>
  <div class="addr"><button id="a_yes"></button><button id="a_no"></button></div>
</div>
<button class="big yes" id="b_yes"></button>
<button class="big no" id="b_no"></button>
</div></div>
<div class="foot">POWERED BY PAKKAORDER</div>
</div>
<script>
const SUPA='https://TU-PROYECTO.supabase.co';
const ANON='TU-ANON-KEY';
const T=new URLSearchParams(location.search).get('t');
const STR={
hi:{sub:'Order confirm karein',chk:'Check ho raha hai...',rdy:'Confirm ke liye taiyaar',q:'Kya yeh pata sahi hai?',ay:'Pata sahi hai',an:'Pata galat hai',yes:'Haan, pakka ✅',no:'Nahi, maine order nahi kiya ❌',dy:'Dhanyavaad! Aapka order pakka ho gaya.',dn:'Dhanyavaad. Humne order cancel kar diya.',cod:'COD',inv:'Link manya nahi hai'},
ta:{sub:'ஆர்டரை உறுதிப்படுத்தவும்',chk:'சரிபார்க்கிறது...',rdy:'உறுதிப்படுத்த தயார்',q:'இந்த முகவரி சரியா?',ay:'முகவரி சரி',an:'முகவரி தவறு',yes:'ஆம், உறுதி ✅',no:'இல்லை, நான் ஆர்டர் செய்யவில்லை ❌',dy:'நன்றி! உங்கள் ஆர்டர் உறுதியானது.',dn:'நன்றி. ஆர்டர் ரத்து செய்யப்பட்டது.',cod:'COD',inv:'இணைப்பு செல்லுபடியாகாது'},
te:{sub:'ఆర్డర్‌ను నిర్ధారించండి',chk:'తనిఖీ చేస్తోంది...',rdy:'నిర్ధారించడానికి సిద్ధం',q:'ఈ చిరునామా సరైనదా?',ay:'చిరునామా సరి',an:'చిరునామా తప్పు',yes:'అవును, పక్కా ✅',no:'కాదు, నేను ఆర్డర్ చేయలేదు ❌',dy:'ధన్యవాదాలు! మీ ఆర్డర్ ఖరారైంది.',dn:'ధన్యవాదాలు. ఆర్డర్ రద్దు చేయబడింది.',cod:'COD',inv:'లింక్ చెల్లదు'},
bn:{sub:'অর্ডার নিশ্চিত করুন',chk:'যাচাই হচ্ছে...',rdy:'নিশ্চিত করতে প্রস্তুত',q:'এই ঠিকানা কি সঠিক?',ay:'ঠিকানা সঠিক',an:'ঠিকানা ভুল',yes:'হ্যাঁ, পাক্কা ✅',no:'না, আমি অর্ডর করিনি ❌',dy:'ধন্যবাদ! আপনার অর্ডার পাকা হলো।',dn:'ধন্যবাদ। অর্ডার বাতিল করা হয়েছে।',cod:'COD',inv:'লিংকটি বৈধ নয়'},
en:{sub:'Confirm your order',chk:'Checking...',rdy:'Ready to confirm',q:'Is this address correct?',ay:'Address is correct',an:'Address is wrong',yes:'Yes, pakka ✅',no:'No, I did not order ❌',dy:'Thank you! Your order is confirmed.',dn:'Thank you. The order was cancelled.',cod:'COD',inv:'Link is not valid'}};
let L=(navigator.language||'en').slice(0,2); if(!STR[L])L='en';
let addrOk=true,P=null;
const $=id=>document.getElementById(id);
const vib=()=>{if(navigator.vibrate)navigator.vibrate(12)};
function rpc(n,a){return fetch(SUPA+'/rest/v1/rpc/'+n,{method:'POST',headers:{'apikey':ANON,'Authorization':'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>{if(!r.ok)throw new Error('x');return r.json()})}
function render(){const s=STR[L];
 $('st').textContent=P?s.rdy:s.chk;
 $('q_addr').textContent=s.q;$('a_yes').textContent=s.ay;$('a_no').textContent=s.an;
 $('b_yes').textContent=s.yes;$('b_no').textContent=s.no;
 $('a_yes').classList.toggle('on',addrOk);$('a_no').classList.toggle('on',!addrOk);
 document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 if(P)$('o_cod').textContent=s.cod+'  Rs '+P.cod}
function langs(){$('langs').innerHTML='';Object.keys(STR).forEach(k=>{const b=document.createElement('button');b.dataset.l=k;b.textContent={hi:'हिं',ta:'தமிழ்',te:'తె',bn:'বাং',en:'EN'}[k];b.onclick=()=>{vib();L=k;render()};$('langs').appendChild(b)})}
function fail(m){$('err').textContent=m;$('err').style.display='block';$('body').style.display='none';$('st').textContent='—'}
function done(ok){vib();const s=STR[L];
 $('main').innerHTML='<div class="glass"><div class="done">'+(ok?'<div class="check"></div>':'')+'<div class="dt">'+(ok?s.dy:s.dn)+'</div></div></div>'}
$('a_yes').onclick=()=>{vib();addrOk=true;render()};
$('a_no').onclick=()=>{vib();addrOk=false;render()};
$('b_yes').onclick=()=>{rpc('confirm_order',{p_token:T,p_action:'yes',p_address_ok:addrOk,p_lang:L}).then(()=>done(true)).catch(()=>done(true))};
$('b_no').onclick=()=>{rpc('confirm_order',{p_token:T,p_action:'no',p_address_ok:addrOk,p_lang:L}).then(()=>done(false)).catch(()=>done(false))};
langs();render();
if(!T){fail(STR[L].inv)}else{
 rpc('touch_order',{p_token:T,p_lang:L}).catch(()=>{});
 rpc('confirm_preview',{p_token:T}).then(p=>{P=p;
  $('o_ref').textContent='#'+p.order_ref;$('o_name').textContent=p.name;
  $('o_addr').textContent=p.address+', '+p.city+' '+p.pincode;
  $('body').style.display='block';render();
 }).catch(()=>fail(STR[L].inv));
}
</script></body></html>
